<!doctype html>
<html lang="zh-CN" data-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIPI · GitHub 项目智能分析</title>
  <meta name="description" content="AI Agent GitHub Project Intelligence Platform">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%233b82f6'/><path d='M9 22V10h4l6 8v-8h4v12h-4l-6-8v8z' fill='white'/></svg>">

  <!-- 主题必须在首屏绘制前定好，否则会闪一下白底。 -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("aipi-theme");
        var theme = saved || (
          window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark" : "light"
        );
        document.documentElement.dataset.theme = theme;
      } catch (e) { /* 隐私模式下 localStorage 会抛错，忽略 */ }
    })();
  </script>

  <link rel="stylesheet" href="/static/app.css">
</head>

<body>

<!-- ================= 图标精灵 =================
     全部内联，避免任何外部请求。 -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></symbol>
  <symbol id="i-fork" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2.6"/><circle cx="18" cy="5" r="2.6"/><circle cx="12" cy="19" r="2.6"/><path d="M6 7.6v2.4a2 2 0 002 2h8a2 2 0 002-2V7.6M12 12v4.4"/></symbol>
  <symbol id="i-issue" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.4v.1"/></symbol>
  <symbol id="i-scale" viewBox="0 0 24 24"><path d="M12 3v18M7 7H3l2.2 6a2.6 2.6 0 004.6 0L7 7zm10 0h4l-2.2 6a2.6 2.6 0 01-4.6 0L17 7zM8 20h8"/></symbol>
  <symbol id="i-code" viewBox="0 0 24 24"><path d="M9 18l-6-6 6-6M15 6l6 6-6 6"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H7a2 2 0 00-2 2v16a2 2 0 002 2h10a2 2 0 002-2V7l-5-5z"/><path d="M14 2v5h5"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h3.6l2 2H19a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.4 2"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3l9.5 16.5h-19L12 3z"/><path d="M12 10v4M12 17.2v.1"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5l12 7.5-12 7.5v-15z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8.5 5v14M15.5 5v14"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 10-2.3 6.3"/><path d="M20 4v7h-7"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7.5 10.5L12 15l4.5-4.5M4 20h16"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.3A8.5 8.5 0 019.7 3.5a8.5 8.5 0 1010.8 10.8z"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7.5 3v6c0 4.6-3.1 8.2-7.5 9.5C7.6 20.2 4.5 16.6 4.5 12V6L12 3z"/><path d="M9.2 12.2l2 2 3.6-4"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 4.5A2.5 2.5 0 016.5 2H20v17H6.5A2.5 2.5 0 004 21.5v-17z"/><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/></symbol>
  <symbol id="i-zap" viewBox="0 0 24 24"><path d="M13 2L4.5 13.5H11l-1 8.5L19.5 10.5H13L13 2z"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M8.5 5.5l6.5 6.5-6.5 6.5"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="12" height="12" rx="2"/><path d="M15.5 5.5v-1a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2h1"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10.5 13.5a4 4 0 005.7 0l3-3a4 4 0 10-5.7-5.7L12 6.3"/><path d="M13.5 10.5a4 4 0 00-5.7 0l-3 3a4 4 0 105.7 5.7l1.5-1.5"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5 5h14l2 8v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6l2-8z"/></symbol>
  <symbol id="i-branch" viewBox="0 0 24 24"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="9" r="2.2"/><path d="M7 7.2v9.6M17 11.2c0 3-4 3.4-7 3.4"/></symbol>
</svg>

<!-- ================= 顶栏 ================= -->
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="url(#bg)"/>
        <path d="M9 22.5V9.5h4.1l6 8.2V9.5H23v13h-4.1l-6-8.2v8.2z" fill="#fff"/>
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3b82f6"/>
            <stop offset="1" stop-color="#6366f1"/>
          </linearGradient>
        </defs>
      </svg>
    </span>
    <span class="brand-text">
      <strong>AIPI</strong>
      <span class="brand-sub">GitHub 项目智能分析</span>
    </span>
  </div>

  <div class="topbar-actions">
    <span class="health" id="health" title="服务状态">
      <i class="dot"></i><span id="healthText">连接中…</span>
    </span>
    <button id="themeToggle" class="icon-btn" title="切换主题" aria-label="切换主题">
      <svg class="ico ico-sun"><use href="#i-sun"/></svg>
      <svg class="ico ico-moon"><use href="#i-moon"/></svg>
    </button>
  </div>
</header>

<!-- ================= 主体 ================= -->
<div class="layout">

  <!-- ---------- 侧栏 ---------- -->
  <aside class="sidebar">

    <section class="panel">
      <h2 class="panel-title">
        <svg class="ico"><use href="#i-zap"/></svg> 新建分析
      </h2>

      <form id="startForm" class="form" autocomplete="off">
        <label class="field">
          <span class="field-label">GitHub 仓库地址</span>
          <input id="repo" type="text" spellcheck="false"
                 placeholder="https://github.com/owner/repo"
                 value="https://github.com/rafaelMartinsAndrade/enterprise-finance-agent">
        </label>

        <label class="field">
          <span class="field-label">
            分析问题 <span class="optional">选填</span>
          </span>
          <textarea id="question" rows="3"
            placeholder="例如：重点分析 agent 与 workflow 的协作方式"></textarea>
          <span class="field-hint">
            留空 = 全量等深分析。点名某个模块（agents / workflow / skills /
            tools / rag / memory）时，该模块会展开，其余压缩。
          </span>
        </label>

        <label class="switch-field" for="ragToggle">
          <span class="switch-text">
            <span class="switch-title">
              启用 RAG 语义检索
              <span class="optional">实验性</span>
            </span>
            <span class="switch-hint" id="ragHint">
              分析前先为仓库建向量索引，按六个维度做语义检索，
              命中的代码片段会<strong>叠加</strong>进证据清单。
            </span>
          </span>
          <span class="switch">
            <input type="checkbox" id="ragToggle" role="switch">
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </span>
        </label>

        <div class="rag-warning hidden" id="ragWarning">
          <svg class="ico"><use href="#i-alert"/></svg>
          <span>
            开启后每次分析会额外读取几十个文件并调用本地 Ollama 嵌入，
            <strong>实测约多等 1～2 分钟</strong>；
            且未设置 <code>GITHUB_TOKEN</code> 时极易被限流。
          </span>
        </div>

        <button id="start" class="btn btn-primary btn-block" type="submit">
          <svg class="ico"><use href="#i-play"/></svg> 开始分析
        </button>
      </form>
    </section>

    <section class="panel panel-grow">
      <h2 class="panel-title">
        <svg class="ico"><use href="#i-clock"/></svg> 历史记录
        <button id="refreshHistory" class="icon-btn icon-btn-sm" title="刷新">
          <svg class="ico"><use href="#i-refresh"/></svg>
        </button>
      </h2>
      <div id="history" class="history">
        <div class="history-placeholder">加载中…</div>
      </div>
    </section>

  </aside>

  <!-- ---------- 主区 ---------- -->
  <main class="main">

    <!-- 空态 -->
    <div id="emptyState" class="empty-state">
      <div class="empty-art">
        <svg class="ico"><use href="#i-search"/></svg>
      </div>
      <h3>还没有选中的分析</h3>
      <p>
        填入一个 GitHub 仓库地址，平台会调度 5 个 Agent 读取源码、
        抽取架构与技术栈，产出一份带证据出处的项目智能报告。
      </p>
      <ul class="empty-facts">
        <li><svg class="ico"><use href="#i-shield"/></svg> 结论均附源码行号与出处</li>
        <li><svg class="ico"><use href="#i-layers"/></svg> 六个维度：Agent / Workflow / Skill / Tool / RAG / Memory</li>
        <li><svg class="ico"><use href="#i-book"/></svg> 支持深挖单模块与生成学习路线</li>
      </ul>
    </div>

    <!-- 运行状态 -->
    <section id="statusPanel" class="panel status-panel hidden">
      <div class="status-head">
        <span class="pill" id="status">—</span>
        <span class="status-node" id="node"></span>
        <span class="status-progress" id="progressText"></span>
      </div>

      <div class="progress" id="bar"><i id="progress"></i></div>

      <div id="callout" class="callout hidden">
        <div class="callout-head" id="calloutHead"></div>
        <div class="callout-body" id="calloutBody"></div>

        <!-- 分析方案（仅设计闸门时填充） -->
        <div id="planBox" class="plan-box hidden"></div>

        <!-- 修改问题（点「修改问题」后展开） -->
        <div id="replanBox" class="replan-box hidden">
          <label class="field">
            <span class="field-label">修改分析问题后重新规划</span>
            <textarea id="replanQuestion" rows="3"
              placeholder="改写你想问的问题，Planner 会据此重新生成方案"></textarea>
          </label>
          <div class="row" style="gap:var(--s-2)">
            <button id="replanSubmit" class="btn btn-sm">用新问题重新规划</button>
            <button id="replanCancel" class="btn btn-ghost btn-sm">取消</button>
          </div>
        </div>

        <div class="callout-actions" id="actions"></div>
      </div>

      <div class="status-foot">
        <span class="runid" id="runId"></span>
        <div class="status-controls" id="statusControls"></div>
      </div>

      <div id="error" class="alert alert-danger"></div>
    </section>

    <!-- 报告区 -->
    <section id="reportArea" class="hidden">

      <!-- 报告头 -->
      <header class="report-hero panel">
        <div class="hero-main">
          <div class="hero-title">
            <h1 id="reportTitle">分析报告</h1>
            <a id="repoLink" class="hero-repo" target="_blank" rel="noopener"></a>
          </div>
          <div class="hero-meta" id="heroMeta"></div>
        </div>

        <div class="hero-actions">
          <button id="copyPath" class="btn btn-ghost btn-sm" title="复制报告文件路径">
            <svg class="ico"><use href="#i-copy"/></svg> 复制路径
          </button>
          <button id="download" class="btn btn-ghost btn-sm">
            <svg class="ico"><use href="#i-download"/></svg> MD
          </button>
          <button id="downloadJson" class="btn btn-ghost btn-sm">
            <svg class="ico"><use href="#i-download"/></svg> JSON
          </button>
          <button id="backToMain" class="btn btn-ghost btn-sm hidden">
            <svg class="ico"><use href="#i-chevron"/></svg> 返回主报告
          </button>
        </div>
      </header>

      <!-- 标签页 -->
      <nav class="tabs" id="tabs" role="tablist">
        <button class="tab is-active" data-view="dashboard" role="tab">
          <svg class="ico"><use href="#i-layers"/></svg> 数据看板
        </button>
        <button class="tab" data-view="markdown" role="tab">
          <svg class="ico"><use href="#i-book"/></svg> 报告原文
        </button>
        <button class="tab" data-view="json" role="tab">
          <svg class="ico"><use href="#i-code"/></svg> JSON
        </button>

        <div class="tabs-tools">
          <div class="dropdown" id="deepDiveMenu">
            <button class="btn btn-ghost btn-sm" type="button">
              <svg class="ico"><use href="#i-search"/></svg> 深挖模块
              <svg class="ico ico-caret"><use href="#i-chevron"/></svg>
            </button>
            <div class="dropdown-menu">
              <button data-module="agents">Agent 架构</button>
              <button data-module="workflow">Workflow</button>
              <button data-module="skills">Skill</button>
              <button data-module="tools">Tool</button>
              <button data-module="rag">RAG</button>
              <button data-module="memory">Memory</button>
            </div>
          </div>
          <button id="learningPath" class="btn btn-accent btn-sm">
            <svg class="ico"><use href="#i-book"/></svg> 学习路线
          </button>
        </div>
      </nav>

      <div id="viewHint" class="view-hint hidden"></div>

      <!-- 视图：数据看板 -->
      <div id="viewDashboard" class="view"></div>

      <!-- 视图：报告原文 -->
      <div id="viewMarkdown" class="view hidden">
        <article id="report" class="md"></article>
      </div>

      <!-- 视图：JSON -->
      <div id="viewJson" class="view hidden">
        <div class="json-toolbar">
          <button class="btn btn-ghost btn-sm" id="jsonExpand">全部展开</button>
          <button class="btn btn-ghost btn-sm" id="jsonCollapse">全部折叠</button>
        </div>
        <div id="jsonTree" class="json-tree"></div>
      </div>

    </section>

  </main>
</div>

<div id="toast" class="toast"></div>

<script src="/static/app.js"></script>

</body>
</html>
