# ============================================================
# AIPI Platform 本地部署（方案 B：复用宿主机 MySQL）
# ------------------------------------------------------------
#   docker compose up -d --build
#   → http://localhost:8000
#
# 组成：
#   app     —— 本仓库构建，绑在 8000
#   qdrant  —— 向量库，绑在 6333
#   MySQL   —— 不开容器，直接用宿主机上已有的实例
#
# 为什么 MySQL 不进容器：
#   本机拉不到 mysql 镜像（Docker Hub 网络不通），
#   而宿主机 MySQL 本来就在跑、库结构也齐了，
#   容器化它收益不大。
#
# 【前置条件】宿主机 MySQL 必须允许容器连入：
#   - bind-address 不能是 127.0.0.1，需为 0.0.0.0 或 *
#     （检查：SHOW VARIABLES LIKE 'bind_address';）
#   - 账号要允许从非本机 IP 登录（root@'%' 或对应授权）
#
# 配置来自同目录的 .env（compose 自动读取做变量替换）。
# 没有 .env 时先复制：cp .env.docker.example .env
# ============================================================

name: aipi


services:

  # ----------------------------------------------------------
  # Qdrant —— 向量库
  # ----------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped

    volumes:
      - qdrant_data:/qdrant/storage

    ports:
      - "6333:6333"

    networks: [aipi]


  # ----------------------------------------------------------
  # 应用
  # ----------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: aipi:latest
    restart: unless-stopped

    depends_on:
      qdrant:
        condition: service_started

    # host.docker.internal 在 Docker Desktop（Windows/macOS）上开箱即用，
    # Linux 上需要下面这行显式映射到宿主网关。
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      # --- 运行模式 ---
      APP_ENV: ${APP_ENV:-production}
      # 关掉 SQL echo，否则每个查询都打一行日志
      DEBUG: "false"

      # --- MySQL：指向宿主机，不是容器 ---
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aipi}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD 未设置，请检查 .env}

      # --- Qdrant：容器网络内的服务名 ---
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"

      # --- LLM（DeepSeek，走外网 HTTPS）---
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-120}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-8192}

      # --- Embedding ---
      # 容器内不跑 Ollama。若宿主机有，走 host.docker.internal 指过去。
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}

      # --- GitHub ---
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}

    ports:
      - "8000:8000"

    volumes:
      # 报告落盘到宿主机，方便直接翻看
      - ./reports:/app/reports

    networks: [aipi]


  # ----------------------------------------------------------
  # 【可选】容器化 MySQL
  # ----------------------------------------------------------
  # 拉得到 mysql 镜像时取消注释，并把 app 的 MYSQL_HOST
  # 改回 mysql、恢复 depends_on 与 mysql_data 卷声明即可。
  #
  # mysql:
  #   image: mysql:8.0
  #   restart: unless-stopped
  #   command:
  #     - --character-set-server=utf8mb4
  #     - --collation-server=utf8mb4_unicode_ci
  #     - --max-allowed-packet=64M
  #   environment:
  #     MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?}
  #     MYSQL_DATABASE: ${MYSQL_DATABASE:-aipi}
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #   healthcheck:
  #     test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 24
  #     start_period: 30s
  #   networks: [aipi]


volumes:
  qdrant_data:
  # mysql_data:          # 启用上面的 mysql 服务时一并打开


networks:
  aipi:
    driver: bridge
